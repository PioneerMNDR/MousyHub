name: Notify Telegram about Release 
on:
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Step name in English
      - name: Send message to Telegram 
        # Using a specific version is recommended
        uses: appleboy/telegram-action@v0.1.1 # Replace with the latest stable version if needed
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Specify Markdown format
          format: markdown 
          # Message content translated to English
          message: |
            🚀 *New Release Published!* ✨
            
            📂 **Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})
            🏷️ **Release:** [${{ github.event.release.name }}](${{ github.event.release.html_url }})
            🔖 **Tag:** `${{ github.event.release.tag_name }}`
            👤 **Author:** @${{ github.event.release.author.login }}
            
            📝 *Release Description:*
            ${{ github.event.release.body }}
            
            --- 
            
            🔗 [View details on GitHub](${{ github.event.release.html_url }})
